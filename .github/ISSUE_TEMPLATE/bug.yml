name: Bug report
description: Report a problem with codex-swap
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run and what did you see?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        codex-swap --version: 0.1.0
        codex --version:      codex-cli 0.128.0
        OS:                   macOS 15.x
        Shell:                zsh 5.9
        Number of slots:      3
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: Output of `codex-swap verify`
      description: Skip if the bug is in `verify` itself.
      render: text
