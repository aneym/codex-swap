name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # to create the GitHub release
  id-token: write   # OIDC for PyPI Trusted Publishing

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Release packaging gate
        run: bash scripts/check-release.sh

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/codex-swap
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract changelog section for this tag
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Pull lines from "## $version" up to the next "## " header.
          awk -v ver="$version" '
            $0 ~ "^## "ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section for $version — falling back to commit log." >&2
            echo "## Changes" > release-notes.md
            git log --pretty=format:'- %s' "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD" >> release-notes.md
          fi

      - name: Write release checksums
        run: |
          cp scripts/install.sh install.sh
          # Run sha256sum from inside dist/ so the recorded filenames match
          # the names release assets are uploaded under (no `dist/` prefix);
          # otherwise install.sh's `sha256sum -c` step looks for files in
          # the wrong location and fails. Append install.sh from repo root.
          ( cd dist && sha256sum * ) > SHA256SUMS
          sha256sum install.sh >> SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*
            install.sh
            SHA256SUMS
          generate_release_notes: false
