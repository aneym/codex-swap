[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-swap"
dynamic = ["version"]
description = "Multi-account switcher for the OpenAI Codex CLI — auto-picks the ChatGPT Pro account with the lowest usage."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Alex Neyman" }]
keywords = ["codex", "openai", "cli", "chatgpt", "rate-limit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/aneym/codex-swap"
Issues = "https://github.com/aneym/codex-swap/issues"
Changelog = "https://github.com/aneym/codex-swap/blob/main/CHANGELOG.md"

[project.scripts]
codex-swap = "codex_swap.cli:main"
cx = "codex_swap.cli:cx_main"
claude-swap = "swap.providers.claude.cli:main"
cs = "swap.providers.claude.cli:cs_main"

[tool.hatch.build.targets.wheel]
packages = ["src/swap", "src/codex_swap"]

[tool.hatch.version]
path = "src/swap/__init__.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length warnings — keep messages readable
